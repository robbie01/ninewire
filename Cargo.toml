[workspace]
resolver = "2"
members = ["client", "hashbench", "mediator", "mediator-proto", "npwire","server", "transport", "udt", "udt-example", "udt-sys", "ui", "ui/src-tauri", "ui/ixchg", "util", "player", "player/mpv-sys"]

[workspace.package]
version = "0.0.0"
edition = "2024"

[workspace.dependencies]
util.path = "./util"
npwire.path = "./npwire"
client.path = "./client"
transport = { path = "./transport", default-features = false }

anyhow = "1"
bytes = "1.10"
bytestring = "1.4"
crossbeam = "0.8"
futures = "0.3"
libutp-rs2 = "0.1"
pin-project = "1.1"
rand = "0.10"
scc = "3.3"
thiserror = "2"
tokio = "1.47"
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = "0.3"
range-set = "0.1"

compio = { version = ">=0.19.0-rc.2,<0.20", features = ["fs", "io", "net", "macros"] }
